<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock POS</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,sans-serif;margin:0;padding:12px;max-width:560px;margin:auto;background:#f4f6fa;color:#222}
  h2{margin:8px 0}
  input,button,select{width:100%;padding:14px;font-size:16px;margin:5px 0;border-radius:10px;border:1px solid #ccd}
  button{background:#1a73e8;color:#fff;border:0}
  button.gray{background:#667}
  button.red{background:#d33}
  button.small{width:auto;padding:8px 14px;margin:0}
  button:disabled{opacity:.5}
  .tabs{display:flex;gap:6px;margin:8px 0}
  .tabs button{background:#dde;color:#223;padding:10px 4px;font-size:15px}
  .tabs button.on{background:#1a73e8;color:#fff}
  .card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:38px;padding:6px;margin:0}
  .total{font-size:22px;font-weight:bold;text-align:right}
  .low{color:#c00;font-weight:bold}
  .muted{color:#778;font-size:13px}
  #toast{position:fixed;left:12px;right:12px;bottom:16px;background:#223;color:#fff;padding:14px;border-radius:12px;display:none;z-index:99;text-align:center}
  #toast.bad{background:#c00}
  #scanBox{position:fixed;inset:0;background:#000d;z-index:50;padding:12px}
  #scanBox .inner{max-width:520px;margin:auto;background:#fff;border-radius:14px;padding:12px}
  #reader{width:100%}
  #loginMsg{color:#c00}
</style>
</head>
<body>

<section id="login">
  <h2>Stock POS</h2>
  <input id="pin" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <button id="loginBtn">เข้าสู่ระบบ</button>
  <p id="loginMsg"></p>
</section>

<section id="app" hidden>
  <div class="row"><h2>Stock POS</h2><button id="logoutBtn" class="small gray">ออก</button></div>
  <div class="tabs">
    <button data-tab="sell" class="on">ขาย</button>
    <button data-tab="in">รับเข้า</button>
    <button data-tab="stock">สินค้า</button>
    <button data-tab="hist">ประวัติ</button>
  </div>

  <!-- ขาย -->
  <div id="tab-sell">
    <button id="sellScan">📷 สแกนบาร์โค้ด</button>
    <div class="row">
      <input id="sellInput" placeholder="พิมพ์ SKU หรือชื่อสินค้า">
      <button id="sellAdd" class="small" style="min-width:80px">เพิ่ม</button>
    </div>
    <div id="cart"></div>
    <div class="total" id="cartTotal"></div>
    <button id="checkoutBtn">ตัดสต็อก / ขาย</button>
    <button id="clearBtn" class="gray">ล้างตะกร้า</button>
  </div>

  <!-- รับเข้า -->
  <div id="tab-in" hidden>
    <div class="card">
      <button id="inScan">📷 สแกนบาร์โค้ด</button>
      <input id="inSku" placeholder="SKU / บาร์โค้ด">
      <div id="inInfo" class="muted"></div>
      <input id="inQty" type="number" inputmode="numeric" min="1" value="1" placeholder="จำนวนที่รับเข้า">
      <input id="inName" placeholder="ชื่อสินค้า (จำเป็นสำหรับสินค้าใหม่)">
      <input id="inPrice" type="number" inputmode="decimal" placeholder="ราคาขาย (จำเป็นสำหรับสินค้าใหม่)">
      <input id="inMin" type="number" inputmode="numeric" placeholder="สต็อกขั้นต่ำ (สินค้าใหม่)">
      <button id="inSubmit">บันทึกรับเข้า</button>
    </div>
  </div>

  <!-- สินค้า -->
  <div id="tab-stock" hidden>
    <input id="stockSearch" placeholder="ค้นหา SKU หรือชื่อ">
    <label><input type="checkbox" id="lowOnly" style="width:auto"> เฉพาะสินค้าใกล้หมด</label>
    <div id="stockList"></div>
  </div>

  <!-- ประวัติ -->
  <div id="tab-hist" hidden>
    <button id="histReload" class="gray">รีเฟรชประวัติ</button>
    <div id="histList"></div>
  </div>
</section>

<div id="scanBox" hidden>
  <div class="inner">
    <div id="reader"></div>
    <p class="muted" id="scanHint">เล็งบาร์โค้ดให้อยู่ในกรอบ</p>
    <button id="scanClose" class="red">ปิดกล้อง</button>
  </div>
</div>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbynJDkBxHVNLy0eKLzTATL2nqAA2POPjxz6YCNHwQR_Wg5Nmmespx29aeY9fmnAwjnw/exec';

let session = sessionStorage.getItem('pos_session') || '';
let products = [];
let cart = [];
let pendingId = null;
let busy = false;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 2});
const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

let toastTimer;
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.className = bad ? 'bad' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 3500);
}

async function api(action, data = {}) {
  const body = new URLSearchParams({
    action,
    data: JSON.stringify({ ...data, session })
  });
  const res = await fetch(API_URL, { method: 'POST', body });
  const json = await res.json();
  if (!json.ok) {
    if (/เข้าสู่ระบบใหม่/.test(json.error || '')) showLogin();
    throw new Error(json.error || 'เกิดข้อผิดพลาด');
  }
  return json;
}

/* ---------- ล็อกอิน ---------- */
function showLogin() {
  session = '';
  sessionStorage.removeItem('pos_session');
  $('app').hidden = true;
  $('login').hidden = false;
}

$('loginBtn').onclick = async () => {
  $('loginMsg').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const r = await api('login', { pin: $('pin').value });
    session = r.session;
    sessionStorage.setItem('pos_session', session);
    $('pin').value = '';
    await startApp();
  } catch (e) {
    $('loginMsg').textContent = e.message;
  } finally {
    $('loginBtn').disabled = false;
  }
};
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('logoutBtn').onclick = async () => {
  try { await api('logout'); } catch (e) {}
  showLogin();
};

async function startApp() {
  await loadProducts();
  $('login').hidden = true;
  $('app').hidden = false;
  renderCart();
}

async function loadProducts() {
  const r = await api('products');
  products = r.products;
  renderStock();
}

/* ---------- แท็บ ---------- */
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    ['sell', 'in', 'stock', 'hist'].forEach(t => $('tab-' + t).hidden = (t !== b.dataset.tab));
    if (b.dataset.tab === 'hist') loadHistory();
    if (b.dataset.tab === 'stock') loadProducts().catch(e => toast(e.message, true));
  };
});

/* ---------- สแกนกล้อง ---------- */
let scanner = null, scanCb = null, lastCode = '', lastTime = 0;

async function openScan(cb) {
  scanCb = cb;
  $('scanBox').hidden = false;
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 160 } },
      text => {
        const now = Date.now();
        if (text === lastCode && now - lastTime < 1500) return;
        lastCode = text; lastTime = now;
        if (scanCb) scanCb(String(text).trim());
      },
      () => {}
    );
  } catch (e) {
    toast('เปิดกล้องไม่ได้: ' + (e.message || e) + ' (ตรวจว่าอนุญาตกล้องใน Safari แล้ว)', true);
    closeScan();
  }
}

async function closeScan() {
  $('scanBox').hidden = true;
  if (scanner) {
    try { await scanner.stop(); scanner.clear(); } catch (e) {}
    scanner = null;
  }
}
$('scanClose').onclick = closeScan;

/* ---------- ขาย ---------- */
function findProduct(q) {
  q = String(q || '').trim();
  if (!q) return null;
  let p = products.find(x => x.sku === q);
  if (p) return p;
  const matches = products.filter(x => x.name.toLowerCase().includes(q.toLowerCase()));
  return matches.length === 1 ? matches[0] : null;
}

function addToCart(q) {
  const p = findProduct(q);
  if (!p) { toast('ไม่พบสินค้า: ' + q, true); return false; }
  let line = cart.find(x => x.sku === p.sku);
  if (!line) { line = { sku: p.sku, qty: 0 }; cart.push(line); }
  if (line.qty + 1 > p.stock) {
    toast('สต็อกไม่พอ: ' + p.name + ' (เหลือ ' + p.stock + ')', true);
    if (line.qty === 0) cart = cart.filter(x => x !== line);
    renderCart();
    return false;
  }
  line.qty += 1;
  pendingId = null;
  toast('เพิ่ม: ' + p.name);
  renderCart();
  return true;
}

function renderCart() {
  const box = $('cart');
  if (!cart.length) {
    box.innerHTML = '<p class="muted">ยังไม่มีสินค้าในตะกร้า</p>';
    $('cartTotal').textContent = '';
    return;
  }
  let total = 0;
  box.innerHTML = cart.map((l, i) => {
    const p = products.find(x => x.sku === l.sku) || { name: l.sku, price: 0 };
    total += p.price * l.qty;
    return '<div class="card"><div class="row"><div><b>' + esc(p.name) + '</b>' +
      '<div class="muted">' + esc(l.sku) + ' • ' + money(p.price) + ' บาท</div></div>' +
      '<div class="qty"><button data-i="' + i + '" data-d="-1">−</button><b>' + l.qty +
      '</b><button data-i="' + i + '" data-d="1">+</button></div></div></div>';
  }).join('');
  $('cartTotal').textContent = 'รวม ' + money(total) + ' บาท';
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const l = cart[Number(b.dataset.i)];
      const p = products.find(x => x.sku === l.sku);
      l.qty += Number(b.dataset.d);
      if (p && l.qty > p.stock) { l.qty = p.stock; toast('สต็อกมีแค่ ' + p.stock, true); }
      if (l.qty <= 0) cart = cart.filter(x => x !== l);
      pendingId = null;
      renderCart();
    };
  });
}

$('sellScan').onclick = () => openScan(code => addToCart(code));
$('sellAdd').onclick = () => { if (addToCart($('sellInput').value)) $('sellInput').value = ''; };
$('sellInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('sellAdd').click(); });
$('clearBtn').onclick = () => { cart = []; pendingId = null; renderCart(); };

$('checkoutBtn').onclick = async () => {
  if (!cart.length || busy) return;
  busy = true;
  $('checkoutBtn').disabled = true;
  try {
    pendingId = pendingId || newId();
    const r = await api('checkout', {
      requestId: pendingId,
      items: cart.map(l => ({ sku: l.sku, qty: l.qty })),
      user: 'POS'
    });
    toast(r.duplicate ? 'รายการนี้บันทึกแล้ว' : ('ขายสำเร็จ รวม ' + money(r.total) + ' บาท'));
    cart = [];
    pendingId = null;
    await loadProducts();
    renderCart();
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy = false;
    $('checkoutBtn').disabled = false;
  }
};

/* ---------- รับเข้า ---------- */
function updateInInfo() {
  const p = products.find(x => x.sku === $('inSku').value.trim());
  $('inInfo').textContent = p
    ? 'พบสินค้า: ' + p.name + ' (สต็อกตอนนี้ ' + p.stock + ', ราคา ' + money(p.price) + ')'
    : ($('inSku').value.trim() ? 'สินค้าใหม่: กรอกชื่อและราคาด้วย' : '');
  if (p) {
    $('inName').value = p.name;
    $('inPrice').value = p.price;
    $('inMin').value = p.minStock;
  }
}
$('inSku').addEventListener('input', updateInInfo);
$('inScan').onclick = () => openScan(code => {
  $('inSku').value = code;
  updateInInfo();
  closeScan();
});

$('inSubmit').onclick = async () => {
  if (busy) return;
  const sku = $('inSku').value.trim();
  const qty = Number($('inQty').value);
  if (!sku || !Number.isInteger(qty) || qty <= 0) { toast('กรอก SKU และจำนวนให้ถูกต้อง', true); return; }
  const exists = products.some(x => x.sku === sku);
  if (!exists && (!$('inName').value.trim() || $('inPrice').value === '')) {
    toast('สินค้าใหม่ต้องกรอกชื่อและราคา', true); return;
  }
  busy = true;
  $('inSubmit').disabled = true;
  try {
    const item = { sku, qty };
    if ($('inName').value.trim()) item.name = $('inName').value.trim();
    if ($('inPrice').value !== '') item.price = Number($('inPrice').value);
    if ($('inMin').value !== '') item.minStock = Number($('inMin').value);
    const r = await api('stockIn', { requestId: newId(), items: [item], user: 'POS' });
    toast(r.message || 'รับเข้าสำเร็จ');
    ['inSku', 'inName', 'inPrice', 'inMin'].forEach(id => $(id).value = '');
    $('inQty').value = 1;
    $('inInfo').textContent = '';
    await loadProducts();
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy = false;
    $('inSubmit').disabled = false;
  }
};

/* ---------- สินค้า ---------- */
function renderStock() {
  const q = $('stockSearch').value.trim().toLowerCase();
  const lowOnly = $('lowOnly').checked;
  const list = products
    .filter(p => !q || p.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))
    .filter(p => !lowOnly || p.stock <= p.minStock);
  $('stockList').innerHTML = list.length ? list.map(p => {
    const low = p.stock <= p.minStock;
    return '<div class="card"><div class="row"><div><b>' + esc(p.name) + '</b>' +
      '<div class="muted">' + esc(p.sku) + ' • ' + money(p.price) + ' บาท</div></div>' +
      '<div class="' + (low ? 'low' : '') + '">' + p.stock + (low ? ' ⚠' : '') + '</div></div></div>';
  }).join('') : '<p class="muted">ไม่พบสินค้า</p>';
}
$('stockSearch').addEventListener('input', renderStock);
$('lowOnly').addEventListener('change', renderStock);

/* ---------- ประวัติ ---------- */
async function loadHistory() {
  $('histList').innerHTML = '<p class="muted">กำลังโหลด...</p>';
  try {
    const r = await api('history', { limit: 50 });
    $('histList').innerHTML = r.logs.length ? r.logs.map(l =>
      '<div class="card"><div class="row"><div><b>' + (l.type === 'IN' ? '➕ รับเข้า' : '➖ ขาย') + '</b> ' +
      esc(l.name) + '<div class="muted">' + esc(l.timestamp) + ' • ' + esc(l.sku) + '</div></div>' +
      '<div style="text-align:right">' + l.qty + ' ชิ้น<div class="muted">' + money(l.total) + ' บาท</div></div></div></div>'
    ).join('') : '<p class="muted">ยังไม่มีประวัติ</p>';
  } catch (e) {
    $('histList').innerHTML = '';
    toast(e.message, true);
  }
}
$('histReload').onclick = loadHistory;

if (session) startApp().catch(showLogin);
</script>
</body>
</html>
