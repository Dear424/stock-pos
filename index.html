<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stock POS Scanner (100 SKU)</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --danger: #ef4444;
      --warn: #f59e0b;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    #login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.88), rgba(15,23,42,0.96));
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }
    .pin-input {
      width: 100%;
      font-size: 28px;
      letter-spacing: 12px;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      margin: 14px 0;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }
    .btn-green { background: var(--accent); width: 100%; }
    .btn-green:active { background: var(--accent-dark); }
    .btn-blue { background: var(--blue); }
    .btn-red { background: var(--danger); }
    .btn-gray { background: var(--card); }
    .msg-err { color: #f87171; font-size: 13px; min-height: 18px; margin-top: 6px; }

    #app-screen { max-width: 900px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34,197,94,0.18);
      color: #4ade80;
    }
    .panel {
      background: var(--panel);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .row-flex { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    input.grow { flex: 1; min-width: 160px; }
    #reader { width: 100%; max-width: 420px; margin: 10px auto 0; border-radius: 12px; overflow: hidden; }
    .item-card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .item-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .low-stock { color: #fbbf24; font-weight: 700; }
    .qty-box { display: flex; align-items: center; gap: 8px; }
    .qty-num { min-width: 34px; text-align: center; font-weight: 700; font-size: 17px; }
  </style>
</head>
<body>

  <!-- หน้าล็อกอิน PIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin:0 0 6px;">ระบบสต็อก &amp; ขายหน้าร้าน</h2>
      <div style="color:var(--muted);font-size:13px;">กรอกรหัส PIN 4 หลักเพื่อเข้าใช้งาน</div>
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
      <button id="login-btn" type="button" class="btn-green">เข้าใช้งาน</button>
      <div id="login-msg" class="msg-err"></div>
    </div>
  </div>

  <!-- หน้าหลักระบบสต็อก -->
  <div id="app-screen" class="hidden">
    <div class="topbar">
      <div>
        <strong>Stock POS (Products / Logs)</strong>
        <span id="sync-badge" class="badge">พร้อมใช้งาน (Offline Cache)</span>
      </div>
      <div class="row-flex">
        <button id="toggle-scan-btn" type="button" class="btn-blue">สแกนบาร์โค้ด</button>
        <button id="sync-btn" type="button" class="btn-gray">ซิงก์ชีต</button>
        <button id="lock-btn" type="button" class="btn-gray">ล็อก</button>
      </div>
    </div>
