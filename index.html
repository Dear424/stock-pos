<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stock POS Scanner (100 SKU)</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --danger: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }
    .pin-input {
      width: 100%;
      font-size: 28px;
      letter-spacing: 12px;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      margin: 14px 0;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }
    .btn-green { background: var(--accent); width: 100%; }
    .btn-green:active { background: var(--accent-dark); }
    .btn-blue { background: var(--blue); }
    .btn-red { background: var(--danger); }
    .btn-gray { background: var(--card); }
    .msg-err { color: #f87171; font-size: 13px; min-height: 18px; margin-top: 8px; }
    #app-screen { max-width: 900px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34,197,94,0.18);
      color: #4ade80;
    }
    .panel {
      background: var(--panel);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .row-flex { display: flex; gap: 8px; flex-wrap: wrap; }
    input {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    input.grow { flex: 1; min-width: 160px; }
    #reader { width: 100%; max-width: 420px; margin: 10px auto 0; border-radius: 12px; overflow: hidden; }
    .item-card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .item-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .low-stock { color: #fbbf24; font-weight: 700; }
    .qty-box { display: flex; align-items: center; gap: 8px; }
    .qty-num { min-width: 34px; text-align: center; font-weight: 700; font-size: 17px; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin:0 0 6px;">ระบบสต็อก &amp; ขายหน้าร้าน</h2>
      <div style="color:var(--muted);font-size:13px;">กรอกรหัส PIN 4 หลักเพื่อเข้าใช้งาน</div>
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
      <button id="login-btn" type="button" class="btn-green" onclick="unlockApp()">เข้าใช้งาน</button>
      <div id="login-msg" class="msg-err"></div>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div class="topbar">
      <div>
        <strong>Stock POS (Products / Logs)</strong>
        <span id="sync-badge" class="badge">พร้อมใช้งานในเครื่อง</span>
      </div>
      <div class="row-flex">
        <button id="toggle-scan-btn" type="button" class="btn-blue" onclick="toggleScanner()">สแกนบาร์โค้ด</button>
        <button id="sync-btn" type="button" class="btn-gray" onclick="pullFromSheet()">ซิงก์ชีต</button>
        <button id="lock-btn" type="button" class="btn-gray" onclick="lockApp()">ล็อก</button>
      </div>
    </div>

    <div class="panel">
      <div class="row-flex">
        <input id="search-input" class="grow" type="text" placeholder="ค้นหา SKU หรือชื่อสินค้า..." oninput="renderProducts()" />
        <input id="api-url-input" class="grow" type="text" placeholder="วางลิงก์ Web App จาก Apps Script (เมื่อพร้อม)" />
        <button type="button" class="btn-gray" onclick="saveApiUrl()">บันทึกลิงก์</button>
      </div>
      <div id="reader" class="hidden"></div>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 10px;font-size:16px;">เพิ่มสินค้าใหม่ลง Products</h3>
      <div class="row-flex">
        <input id="new-sku" type="text" placeholder="SKU (เช่น 885...)" style="width:160px;" />
        <input id="new-name" class="grow" type="text" placeholder="Name (ชื่อสินค้า)" />
        <input id="new-price" type="number" placeholder="Price" style="width:100px;" />
        <input id="new-stock" type="number" placeholder="Stock" style="width:90px;" />
        <input id="new-min" type="number" placeholder="MinStock" value="5" style="width:95px;" />
        <button type="button" class="btn-green" style="width:auto;" onclick="addProduct()">เพิ่ม</button>
      </div>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 10px;font-size:16px;">รายการสินค้า</h3>
      <div id="product-list"></div>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 10px;font-size:16px;">ประวัติการทำงานล่าสุด (Logs)</h3>
      <div id="log-list" style="font-size:13px;color:var(--muted);"></div>
    </div>
  </div>

  <script>
    const LOGIN_PIN = "1234";
    const DELETE_PIN = "9999";
    const STORAGE_KEY = "stock_pos_v2_products";
    const LOG_KEY = "stock_pos_v2_logs";
    const API_KEY = "stock_pos_v2_api_url";

    const DEFAULT_PRODUCTS = [
      { SKU: "8854698005050", Name: "OISHI 500ml", Price: 50000, Stock: 20, MinStock: 5 },
      { SKU: "8850660000448", Name: "น้ำตาลสด", Price: 50000, Stock: 10, MinStock: 5 },
      { SKU: "8859313500484", Name: "สตึง สตอเบอรี่ 325", Price: 50000, Stock: 20, MinStock: 5 }
    ];

    let products = [...DEFAULT_PRODUCTS];
    let logs = [];
    let html5QrCode = null;
    let isScanning = false;

    function loadData() {
      try {
        const rawP = localStorage.getItem(STORAGE_KEY);
        const parsedP = rawP ? JSON.parse(rawP) : null;
        products = Array.isArray(parsedP) && parsedP.length ? parsedP : [...DEFAULT_PRODUCTS];
      } catch (e) {
        products = [...DEFAULT_PRODUCTS];
      }
      try {
        const rawL = localStorage.getItem(LOG_KEY);
        const parsedL = rawL ? JSON.parse(rawL) : null;
        logs = Array.isArray(parsedL) ? parsedL : [];
      } catch (e) {
        logs = [];
      }
      const apiInput = document.getElementById("api-url-input");
      if (apiInput) {
        apiInput.value = localStorage.getItem(API_KEY) || "";
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      localStorage.setItem(LOG_KEY, JSON.stringify(logs));
    }

    function unlockApp() {
      const inputEl = document.getElementById("pin-input");
      const msgEl = document.getElementById("login-msg");
      const code = String((inputEl && inputEl.value) || "").trim();

      if (code === LOGIN_PIN) {
        if (msgEl) msgEl.textContent = "";
        if (inputEl) inputEl.value = "";
        loadData();
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("app-screen").classList.remove("hidden");
        renderProducts();
        renderLogs();
      } else if (msgEl) {
        msgEl.textContent = "รหัส PIN ไม่ถูกต้อง ให้กรอก 1234";
      }
    }

    function lockApp() {
      document.getElementById("app-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      const inputEl = document.getElementById("pin-input");
      if (inputEl) {
        inputEl.value = "";
        inputEl.focus();
      }
    }

    function saveApiUrl() {
      const val = String(document.getElementById("api-url-input").value || "").trim();
      localStorage.setItem(API_KEY, val);
      alert(val ? "บันทึกลิงก์ Web App เรียบร้อย" : "ล้างลิงก์ Web App เรียบร้อย");
    }

    function addLog(action, sku, name, delta) {
      logs.unshift({
        time: new Date().toLocaleString("th-TH"),
        action,
        sku,
        name,
        delta
      });
      logs = logs.slice(0, 30);
      saveData();
      renderLogs();
      pushToSheet(action, logs[0]);
    }

    async function pushToSheet(action, logEntry) {
      const url = String(localStorage.getItem(API_KEY) || "").trim();
      if (!url) return;
      try {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, products, log: logEntry })
        });
        document.getElementById("sync-badge").textContent = "ส่งไป Google Sheets แล้ว";
      } catch (e) {
        document.getElementById("sync-badge").textContent = "เก็บในเครื่องชั่วคราว";
      }
    }

    async function pullFromSheet() {
      const url = String(localStorage.getItem(API_KEY) || "").trim();
      if (!url) {
        renderProducts();
        renderLogs();
        alert("ยังไม่ได้วางลิงก์ Web App จาก Google Apps Script (ตอนนี้ใช้งานข้อมูลในเครื่องได้ตามปกติ)");
        return;
      }
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (Array.isArray(data.products) && data.products.length > 0) {
          products = data.products;
          saveData();
          renderProducts();
          document.getElementById("sync-badge").textContent = "ซิงก์ชีตสำเร็จ";
        }
      } catch (e) {
        document.getElementById("sync-badge").textContent = "ใช้ข้อมูลในเครื่อง";
      }
    }

    function adjustStock(index, delta) {
      const item = products[index];
      if (!item) return;
      item.Stock = Math.max(0, Number(item.Stock || 0) + delta);
      saveData();
      renderProducts();
      addLog(delta > 0 ? "ADD_STOCK" : "SALE_DEDUCT", item.SKU, item.Name, delta);
    }

    function deleteItem(index) {
      const item = products[index];
      if (!item) return;
      const pin = prompt("กรอกรหัส PIN ยืนยันการลบ (9999):");
      if (pin !== DELETE_PIN) {
        alert("รหัสยืนยันการลบไม่ถูกต้อง");
        return;
      }
      products.splice(index, 1);
      saveData();
      renderProducts();
      addLog("DELETE_ITEM", item.SKU, item.Name, 0);
    }

    function addProduct() {
      const sku = document.getElementById("new-sku").value.trim();
      const name = document.getElementById("new-name").value.trim();
      const price = Number(document.getElementById("new-price").value || 0);
      const stock = Number(document.getElementById("new-stock").value || 0);
      const minStock = Number(document.getElementById("new-min").value || 5);
      if (!sku || !name) {
        alert("กรุณากรอก SKU และ Name");
        return;
      }
      products.push({ SKU: sku, Name: name, Price: price, Stock: stock, MinStock: minStock });
      saveData();
      renderProducts();
      addLog("ADD_PRODUCT", sku, name, stock);
      document.getElementById("new-sku").value = "";
      document.getElementById("new-name").value = "";
      document.getElementById("new-price").value = "";
      document.getElementById("new-stock").value = "";
    }

    function renderProducts() {
      const q = String((document.getElementById("search-input") && document.getElementById("search-input").value) || "").trim().toLowerCase();
      const listEl = document.getElementById("product-list");
      const filtered = products.filter(p =>
        String(p.SKU || "").toLowerCase().includes(q) ||
        String(p.Name || "").toLowerCase().includes(q)
      );

      if (!filtered.length) {
        listEl.innerHTML = '<div style="color:var(--muted);">ไม่พบรายการสินค้า</div>';
        return;
      }

      listEl.innerHTML = filtered.map((p) => {
        const realIdx = products.findIndex(x => x.SKU === p.SKU && x.Name === p.Name);
        const stockNum = Number(p.Stock || 0);
        const minNum = Number(p.MinStock || 0);
        const isLow = stockNum <= minNum;
        return `
          <div class="item-card">
            <div>
              <div><strong>${p.Name}</strong> <span style="color:var(--muted);">(${p.SKU})</span></div>
              <div class="item-meta">
                ราคา: ${Number(p.Price || 0).toLocaleString()} |
                จุดสั่งซื้อขั้นต่ำ: ${minNum} |
                <span class="${isLow ? "low-stock" : ""}">${isLow ? "สต็อกต่ำ!" : "ปกติ"}</span>
              </div>
            </div>
            <div class="qty-box">
              <button type="button" class="btn-gray" onclick="adjustStock(${realIdx}, -1)">-</button>
              <span class="qty-num">${stockNum}</span>
              <button type="button" class="btn-green" style="width:auto;" onclick="adjustStock(${realIdx}, 1)">+</button>
              <button type="button" class="btn-red" onclick="deleteItem(${realIdx})">ลบ</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderLogs() {
      const logEl = document.getElementById("log-list");
      if (!logs.length) {
        logEl.innerHTML = "ยังไม่มีประวัติการทำงาน";
        return;
      }
      logEl.innerHTML = logs.slice(0, 8).map(l =>
        `<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);">[${l.time}] ${l.action} — ${l.name} (${l.sku}) ${l.delta ? "(" + (l.delta > 0 ? "+" + l.delta : l.delta) + ")" : ""}</div>`
      ).join("");
    }

    async function toggleScanner() {
      const readerEl = document.getElementById("reader");
      const btn = document.getElementById("toggle-scan-btn");
      if (!isScanning) {
        readerEl.classList.remove("hidden");
        html5QrCode = new Html5Qrcode("reader");
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 140 } },
            (decodedText) => {
              const code = String(decodedText || "").trim();
              const idx = products.findIndex(p => String(p.SKU).trim() === code);
              if (idx >= 0) {
                adjustStock(idx, -1);
                alert("สแกนตัดสต็อก: " + products[idx].Name + " (" + code + ")");
              } else {
                document.getElementById("new-sku").value = code;
                alert("ไม่พบรหัส " + code + " ในระบบ กรอกชื่อและราคาเพื่อเพิ่มใหม่ได้เลย");
              }
            },
            () => {}
          );
          isScanning = true;
          btn.textContent = "ปิดกล้อง";
        } catch (err) {
          alert("เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์");
        }
      } else {
        try {
          if (html5QrCode) await html5QrCode.stop();
        } catch (e) {}
        readerEl.classList.add("hidden");
        isScanning = false;
        btn.textContent = "สแกนบาร์โค้ด";
      }
    }

    document.getElementById("pin-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlockApp();
    });
  </script>
</body>
</html>
