<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock POS</title>
<style>
  body{font-family:sans-serif;margin:0;padding:16px;max-width:480px;margin:auto}
  input,button{width:100%;padding:14px;font-size:16px;margin:6px 0;box-sizing:border-box}
  button{background:#1a73e8;color:#fff;border:0;border-radius:8px}
  #loginMsg{color:#c00}
</style>
</head>
<body>

<section id="login">
  <h2>Stock POS</h2>
  <input id="pin" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <button id="loginBtn">เข้าสู่ระบบ</button>
  <p id="loginMsg"></p>
</section>

<section id="app" hidden>
  <button id="logoutBtn">ออกจากระบบ</button>
  <p id="status"></p>
  <!-- ส่วนขาย / รับเข้า / ประวัติ จะมาต่อตรงนี้ -->
</section>

<script>
const API_URL = 'ใส่ URL Web App ที่ลงท้าย /exec ตรงนี้';
let session = sessionStorage.getItem('pos_session') || '';

const $ = id => document.getElementById(id);

async function api(action, data = {}) {
  const body = new URLSearchParams({
    action,
    data: JSON.stringify({ ...data, session })
  });
  const res = await fetch(API_URL, { method: 'POST', body });
  const json = await res.json();
  if (!json.ok) {
    if (/เข้าสู่ระบบใหม่/.test(json.error || '')) showLogin();
    throw new Error(json.error || 'เกิดข้อผิดพลาด');
  }
  return json;
}

function showLogin() {
  session = '';
  sessionStorage.removeItem('pos_session');
  $('app').hidden = true;
  $('login').hidden = false;
}

function showApp() {
  $('login').hidden = true;
  $('app').hidden = false;
}

$('loginBtn').onclick = async () => {
  $('loginMsg').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const r = await api('login', { pin: $('pin').value });
    session = r.session;
    sessionStorage.setItem('pos_session', session);
    $('pin').value = '';
    await startApp();
  } catch (e) {
    $('loginMsg').textContent = e.message;
  } finally {
    $('loginBtn').disabled = false;
  }
};

$('logoutBtn').onclick = async () => {
  try { await api('logout'); } catch (e) {}
  showLogin();
};

async function startApp() {
  const r = await api('products');
  showApp();
  $('status').textContent = 'เชื่อมต่อสำเร็จ: มีสินค้า ' + r.products.length + ' รายการ';
}

if (session) startApp().catch(showLogin);
</script>
</body>
</html>
