<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock POS</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--b:#1d4ed8;--g:#047857;--r:#b91c1c;--t:#0f172a;--m:#64748b}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:auto;max-width:640px;padding:12px 12px 24px;background:#f1f5f9;color:var(--t);font-family:-apple-system,"Noto Sans Lao","Noto Sans Thai",sans-serif}
button,input,textarea{font:inherit;width:100%;padding:12px;margin:4px 0;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
button{background:var(--b);color:#fff;border:0;font-weight:600}
button.s{background:#e2e8f0;color:var(--t)}button.d{background:var(--r)}
button.sm{width:auto;padding:8px 12px;margin:0}button:disabled{opacity:.5}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:8px 0}
.tabs button{width:auto;white-space:nowrap;background:#e2e8f0;color:var(--t);margin:0}
.tabs button.on{background:var(--b);color:#fff}
.c{background:#fff;border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 1px 2px #0002}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{color:var(--m);font-size:13px}.tot{font-size:28px;font-weight:700;text-align:right}
.low{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.seg{display:flex;gap:6px}.seg button{background:#e2e8f0;color:var(--t)}.seg button.on{background:var(--g);color:#fff}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.q button{background:#ecfdf5;color:var(--g);border:1px solid #6ee7b7}
.bar{height:8px;background:var(--b);border-radius:4px}
#toast{position:fixed;left:12px;right:12px;bottom:16px;background:#0f172a;color:#fff;padding:14px;border-radius:10px;z-index:50;text-align:center}
#toast.bad{background:var(--r)}
</style>
</head>
<body>
<section id="lg">
  <h2>Stock POS</h2>
  <input id="ui" inputmode="numeric" placeholder="ລະຫັດປະຈຳຕົວ" autocomplete="username">
  <input id="pw" type="password" placeholder="ລະຫັດຜ່ານ" autocomplete="current-password">
  <button id="lb">ເຂົ້າສູ່ລະບົບ</button><p id="lm" class="low"></p>
</section>

<section id="ap" hidden>
  <div class="r"><div><b>Stock POS</b><div class="m" id="who"></div></div><button id="lo" class="s sm">ອອກຈາກລະບົບ</button></div>
  <div class="tabs" id="tb">
    <button data-t="sell" class="on">ຂາຍ</button><button data-t="in">ຮັບເຂົ້າ</button><button data-t="prod">ສິນຄ້າ</button>
    <button data-t="bill" data-b="1">ບິນ</button><button data-t="hist">ປະຫວັດ</button>
    <button data-t="rep" data-a="1">ລາຍງານ</button><button data-t="set" data-a="1">ຕັ້ງຄ່າ</button>
  </div>

  <div id="p-sell">
    <button id="sc">ສະແກນບາໂຄດ</button>
    <div class="r"><input id="sq" placeholder="SKU / ຊື່ສິນຄ້າ"><button id="sa" class="sm" style="margin-left:6px">ເພີ່ມ</button></div>
    <div id="cart"></div><div class="tot" id="ct"></div>
    <button id="pay">ຊຳລະເງິນ</button><button id="cl" class="s">ລ້າງກະຕ່າ</button>
  </div>

  <div id="p-in" hidden><div class="c">
    <button id="is">ສະແກນບາໂຄດ</button>
    <input id="ik" placeholder="SKU"><div class="m" id="ii"></div>
    <input id="iq" type="number" inputmode="numeric" value="1" placeholder="ຈຳນວນ">
    <div id="inw"><input id="iname" placeholder="ຊື່ສິນຄ້າ (ສິນຄ້າໃໝ່)"><input id="iprice" inputmode="numeric" placeholder="ລາຄາ (₭)"><input id="imin" inputmode="numeric" placeholder="ສະຕັອກຂັ້ນຕ່ຳ"><input id="icat" placeholder="ໝວດໝູ່"></div>
    <button id="ib">ບັນທຶກ</button>
  </div></div>

  <div id="p-prod" hidden>
    <input id="ps" placeholder="ຄົ້ນຫາ"><label><input type="checkbox" id="lw" style="width:auto"> ສິນຄ້າໃກ້ໝົດ</label>
    <div id="pl"></div>
  </div>

  <div id="p-bill" hidden>
    <input id="bq" placeholder="ຄົ້ນຫາບິນ / ສິນຄ້າ"><button id="bs" class="s">ຄົ້ນຫາ</button><div id="bl"></div>
  </div>

  <div id="p-hist" hidden><button id="hr" class="s">ໂຫຼດໃໝ່</button><div id="hl"></div></div>

  <div id="p-rep" hidden><input type="month" id="rm"><button id="rg">ເບິ່ງລາຍງານ</button><div id="rb"></div></div>

  <div id="p-set" hidden><div class="c">
    <b>QR ຮັບເງິນ (LAO QR)</b>
    <input id="cb" placeholder="ຊື່ທະນາຄານ"><input id="cn" placeholder="ຊື່ບັນຊີ"><input id="ca" placeholder="ເລກບັນຊີ">
    <textarea id="ce" rows="4" placeholder="ຂໍ້ຄວາມ QR ຂອງຮ້ານ (ຂຶ້ນຕົ້ນດ້ວຍ 000201)"></textarea>
    <div class="m" id="cst"></div><button id="cs">ບັນທຶກ</button>
  </div></div>
</section>

<div class="ov" id="m" hidden><div class="box">
  <div class="r"><b id="mt"></b><button class="s sm" id="mx">ປິດ</button></div>
  <div id="mb"></div><button id="mok"></button>
</div></div>
<div class="ov" id="sv" hidden><div class="box"><div id="reader"></div><button id="sx" class="d">ປິດກ້ອງ</button></div></div>
<div id="toast" hidden></div>

<script>
const API='https://script.google.com/macros/s/AKfycbykD5lzUyATKaIApFWVBTa_EMaDfaxXLNRWnS1fYKTPZQWf1bzQjiZf9PjCJ6r3E16A9A/exec';
const STAFF_RETURN=false; // ตั้ง true ถ้าอนุญาตให้พนักงานคืนสินค้า (ต้องแก้ STAFF_CAN_RETURN ใน Sheet ด้วย)
const T={IN:'ຮັບເຂົ້າ',OUT:'ຂາຍ',RETURN:'ຮັບຄືນ',ADJ:'ປັບສະຕັອກ'},MT={cash:'ເງິນສົດ',qr:'QR'},ST={partial:'ຮັບຄືນບາງສ່ວນ',voided:'ຍົກເລີກແລ້ວ'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US')+' ₭';
const dig=s=>Number(String(s).replace(/\D/g,''))||0;
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
let S={session:sessionStorage.getItem('s')||'',user:JSON.parse(sessionStorage.getItem('u')||'null'),products:[],qr:{},cart:[],rid:null,bills:[]};
const isA=()=>S.user&&S.user.role==='admin';

let tt;function toast(x,bad){const t=$('toast');t.textContent=x;t.className=bad?'bad':'';t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}
async function api(a,d={}){
  const r=await fetch(API,{method:'POST',body:new URLSearchParams({action:a,data:JSON.stringify({...d,session:S.session})})});
  const j=await r.json();
  if(!j.ok){if(/เข้าสู่ระบบใหม่/.test(j.error||''))out();throw new Error(j.error||'Error')}
  return j;
}
function modal(title,html,ok,fn){
  $('mt').textContent=title;$('mb').innerHTML=html;
  const b=$('mok');b.hidden=!ok;b.textContent=ok||'';
  b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){toast(e.message,1)}b.disabled=false};
  $('m').hidden=false;
}
const closeM=()=>$('m').hidden=true;$('mx').onclick=closeM;

/* ล็อกอิน */
function out(){S.session='';S.user=null;sessionStorage.clear();$('ap').hidden=true;$('lg').hidden=false}
$('lb').onclick=async()=>{
  $('lm').textContent='';$('lb').disabled=true;
  try{
    const r=await api('login',{userId:$('ui').value,password:$('pw').value});
    S.session=r.session;S.user=r.user;sessionStorage.setItem('s',S.session);sessionStorage.setItem('u',JSON.stringify(S.user));
    $('pw').value='';await start();
  }catch(e){$('lm').textContent=e.message}
  $('lb').disabled=false;
};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lb').click()};
$('lo').onclick=async()=>{try{await api('logout')}catch(e){}out()};
async function start(){
  await load();
  $('who').textContent=S.user.name+' · '+(isA()?'ຜູ້ຈັດການ':'ພະນັກງານ');
  document.querySelectorAll('#tb [data-a]').forEach(b=>b.hidden=!isA());
  document.querySelectorAll('#tb [data-b]').forEach(b=>b.hidden=!(isA()||STAFF_RETURN));
  $('inw').hidden=!isA();$('rm').value=new Date().toISOString().slice(0,7);
  $('lg').hidden=true;$('ap').hidden=false;tab('sell');renderCart();
}
async function load(){const r=await api('products');S.products=r.products;S.qr=r.qrConfig||{};renderProd();fillSet()}

/* แท็บ */
const TABS=['sell','in','prod','bill','hist','rep','set'];
function tab(t){
  TABS.forEach(x=>$('p-'+x).hidden=x!==t);
  document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='hist')loadHist();if(t==='bill')loadBills();if(t==='prod')load().catch(e=>toast(e.message,1));
}
$('tb').onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};

/* สแกน */
let sn=null,last='',lt=0;
async function scan(cb){
  $('sv').hidden=false;
  try{
    sn=new Html5Qrcode('reader');
    await sn.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},x=>{
      const n=Date.now();if(x===last&&n-lt<1500)return;last=x;lt=n;cb(String(x).trim());
    },()=>{});
  }catch(e){toast('ເປີດກ້ອງບໍ່ໄດ້: '+(e.message||e),1);closeScan()}
}
async function closeScan(){$('sv').hidden=true;if(sn){try{await sn.stop();sn.clear()}catch(e){}sn=null}}
$('sx').onclick=closeScan;

/* ขาย */
function find(q){
  q=q.trim();if(!q)return null;
  const p=S.products.find(x=>x.sku===q);if(p)return p;
  const l=S.products.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
  return l.length===1?l[0]:null;
}
function add(q){
  const p=find(q);if(!p){toast('ບໍ່ພົບສິນຄ້າ: '+q,1);return false}
  let l=S.cart.find(x=>x.sku===p.sku);
  if(!l){l={sku:p.sku,qty:0};S.cart.push(l)}
  if(l.qty+1>p.stock){if(!l.qty)S.cart.pop();renderCart();toast('ສະຕັອກບໍ່ພໍ: '+p.name,1);return false}
  l.qty++;S.rid=null;renderCart();toast(p.name);return true;
}
const cartTotal=()=>S.cart.reduce((s,l)=>{const p=S.products.find(x=>x.sku===l.sku);return s+(p?p.price*l.qty:0)},0);
function renderCart(){
  $('cart').innerHTML=S.cart.length?S.cart.map((l,i)=>{
    const p=S.products.find(x=>x.sku===l.sku)||{name:l.sku,price:0};
    return `<div class="c r"><div><b>${esc(p.name)}</b><div class="m">${esc(l.sku)} · ${fmt(p.price)}</div></div>
    <div class="r"><button class="sm s" data-i="${i}" data-d="-1">−</button><b>${l.qty}</b><button class="sm" data-i="${i}" data-d="1">+</button></div></div>`;
  }).join(''):'<p class="m">ຍັງບໍ່ມີສິນຄ້າໃນກະຕ່າ</p>';
  $('ct').textContent=S.cart.length?'ລວມ '+fmt(cartTotal()):'';
}
$('cart').onclick=e=>{
  const i=e.target.dataset.i;if(i==null)return;
  const l=S.cart[i],p=S.products.find(x=>x.sku===l.sku);
  l.qty+=Number(e.target.dataset.d);
  if(p&&l.qty>p.stock){l.qty=p.stock;toast('ສະຕັອກມີ '+p.stock,1)}
  if(l.qty<=0)S.cart.splice(i,1);
  S.rid=null;renderCart();
};
$('sc').onclick=()=>scan(add);
$('sa').onclick=()=>{if(add($('sq').value))$('sq').value=''};
$('sq').onkeydown=e=>{if(e.key==='Enter')$('sa').click()};
$('cl').onclick=()=>{S.cart=[];S.rid=null;renderCart()};

/* ชำระเงิน */
$('pay').onclick=()=>{
  if(!S.cart.length)return;
  const total=cartTotal();let mode='cash',rec=0,payload='';
  modal('ຊຳລະເງິນ',`<div class="tot">${fmt(total)}</div>
    <div class="seg"><button id="mc" class="on">ເງິນສົດ</button><button id="mq">QR</button></div><div id="pbd"></div>`,'ຢືນຢັນຮັບເງິນ',async()=>{
    if(mode==='cash'&&rec<total)throw new Error('ເງິນທີ່ຮັບບໍ່ພໍ');
    if(mode==='qr'&&!payload)throw new Error('ຍັງບໍ່ມີ QR');
    S.rid=S.rid||uid();
    const r=await api('checkout',{requestId:S.rid,items:S.cart.map(l=>({sku:l.sku,qty:l.qty})),paymentMethod:mode,received:mode==='cash'?rec:undefined});
    S.rid=null;S.cart=[];await load();renderCart();
    modal('ສຳເລັດ',`<div class="m">ລວມ</div><div class="tot">${fmt(r.total)}</div>
      ${r.method==='cash'?`<div class="m">ຮັບມາ ${fmt(r.received)}</div><div class="m">ເງິນທອນ</div><div class="tot ok">${fmt(r.change)}</div>`:'<div class="m">ຊຳລະດ້ວຍ QR</div>'}`,'ປິດ',closeM);
  });
  const draw=async()=>{
    $('mc').classList.toggle('on',mode==='cash');$('mq').classList.toggle('on',mode==='qr');
    const b=$('pbd');
    if(mode==='cash'){
      b.innerHTML=`<input id="rc" inputmode="numeric" placeholder="ຮັບເງິນມາ (₭)" value="${rec||''}"><div class="q">
        ${[5000,10000,20000,50000,100000].map(v=>`<button data-v="${v}">+${v.toLocaleString('en-US')}</button>`).join('')}<button data-v="x">ພໍດີ</button></div>
        <div class="m">ເງິນທອນ</div><div class="tot ok" id="chg"></div>`;
      const up=()=>{$('chg').textContent=fmt(Math.max(0,rec-total))};up();
      $('rc').oninput=e=>{rec=dig(e.target.value);up()};
      b.querySelectorAll('.q button').forEach(x=>x.onclick=()=>{rec=x.dataset.v==='x'?total:rec+Number(x.dataset.v);$('rc').value=rec;up()});
    }else{
      b.innerHTML='<p class="m">ກຳລັງສ້າງ QR...</p>';
      try{
        payload=(await api('qrPayload',{amount:total})).payload;
        const q=qrcode(0,'M');q.addData(payload);q.make();
        b.innerHTML=`<div style="text-align:center">${q.createSvgTag({cellSize:5,margin:4})}<div class="tot" style="text-align:center">${fmt(total)}</div>
          <p class="m">ໃຫ້ລູກຄ້າສະແກນ ແລ້ວກວດຍອດເຂົ້າໃນແອັບທະນາຄານກ່ອນກົດຢືນຢັນ</p></div>`;
      }catch(e){b.innerHTML=`<p class="low">${esc(e.message)}</p>`}
    }
  };
  $('mc').onclick=()=>{mode='cash';draw()};$('mq').onclick=()=>{mode='qr';draw()};draw();
};

/* รับเข้า */
function fillIn(){
  const p=S.products.find(x=>x.sku===$('ik').value.trim());
  $('ii').textContent=p?`${p.name} · ສະຕັອກ ${p.stock} · ${fmt(p.price)}`:($('ik').value.trim()?(isA()?'ສິນຄ້າໃໝ່: ໃສ່ຊື່ ແລະ ລາຄາ':'ບໍ່ພົບສິນຄ້າ (ຜູ້ຈັດການເປັນຜູ້ເພີ່ມສິນຄ້າໃໝ່)'):'');
  if(p){$('iname').value=p.name;$('iprice').value=p.price;$('imin').value=p.minStock;$('icat').value=p.category}
}
$('ik').oninput=fillIn;$('is').onclick=()=>scan(c=>{$('ik').value=c;fillIn();closeScan()});
$('ib').onclick=async()=>{
  const sku=$('ik').value.trim(),qty=Number($('iq').value);
  if(!sku||!Number.isInteger(qty)||qty<=0)return toast('ໃສ່ SKU ແລະ ຈຳນວນໃຫ້ຖືກ',1);
  $('ib').disabled=true;
  try{
    const it={sku,qty};
    if(isA()){if($('iname').value.trim())it.name=$('iname').value.trim();if($('iprice').value!=='')it.price=dig($('iprice').value);
      if($('imin').value!=='')it.minStock=dig($('imin').value);if($('icat').value.trim())it.category=$('icat').value.trim()}
    const r=await api('stockIn',{requestId:uid(),items:[it]});
    toast(r.message);['ik','iname','iprice','imin','icat'].forEach(i=>$(i).value='');$('iq').value=1;$('ii').textContent='';await load();
  }catch(e){toast(e.message,1)}
  $('ib').disabled=false;
};

/* สินค้า */
function renderProd(){
  const q=$('ps').value.trim().toLowerCase(),lw=$('lw').checked;
  const l=S.products.filter(p=>(!q||p.sku.toLowerCase().includes(q)||p.name.toLowerCase().includes(q))&&(!lw||p.stock<=p.minStock));
  $('pl').innerHTML=l.length?l.map(p=>`<div class="c r" data-k="${esc(p.sku)}"><div><b>${esc(p.name)}</b>
    <div class="m">${esc(p.sku)} · ${esc(p.category)} · ${fmt(p.price)}</div></div><div class="${p.stock<=p.minStock?'low':''}">${p.stock.toLocaleString('en-US')}</div></div>`).join(''):'<p class="m">ບໍ່ພົບສິນຄ້າ</p>';
}
$('ps').oninput=renderProd;$('lw').onchange=renderProd;
$('pl').onclick=e=>{
  if(!isA())return;const d=e.target.closest('[data-k]');if(!d)return;
  const p=S.products.find(x=>x.sku===d.dataset.k);
  modal('ແກ້ໄຂສິນຄ້າ',['ຊື່|n|'+p.name,'ລາຄາ (₭)|p|'+p.price,'ສະຕັອກ|s|'+p.stock,'ສະຕັອກຂັ້ນຕ່ຳ|m|'+p.minStock,'ໝວດໝູ່|c|'+p.category]
    .map(x=>{const[a,i,v]=x.split('|');return `<div class="m">${a}</div><input id="e${i}" value="${esc(v)}">`}).join(''),'ບັນທຶກ',async()=>{
    await api('adminAdjust',{sku:p.sku,name:$('en').value,price:dig($('ep').value),stock:dig($('es').value),minStock:dig($('em').value),category:$('ec').value});
    closeM;closeM();toast('ບັນທຶກແລ້ວ');await load();
  });
};

/* บิล / คืนสินค้า */
async function loadBills(){
  $('bl').innerHTML='<p class="m">ກຳລັງໂຫຼດ...</p>';
  try{
    S.bills=(await api('bills',{limit:20,search:$('bq').value})).bills;
    $('bl').innerHTML=S.bills.length?S.bills.map((b,i)=>`<div class="c"><div class="r"><div><b>${fmt(b.total)}</b> <span class="m">${MT[b.method]||''}</span>
      <div class="m">${esc(b.time)} · ${esc(b.user)}</div></div><span class="low">${ST[b.status]||''}</span></div>
      ${b.items.map(it=>`<div class="r m"><span>${esc(it.name)} × ${it.remaining}/${it.qty}</span>${it.remaining>0?`<button class="sm s" data-a="r" data-i="${i}" data-s="${esc(it.sku)}">ຮັບຄືນ</button>`:''}</div>`).join('')}
      ${b.status!=='voided'?`<button class="d" data-a="v" data-i="${i}">ຍົກເລີກທັງບິນ</button>`:''}</div>`).join(''):'<p class="m">ບໍ່ພົບບິນ</p>';
  }catch(e){$('bl').innerHTML='';toast(e.message,1)}
}
$('bs').onclick=loadBills;
$('bl').onclick=e=>{
  const a=e.target.dataset.a;if(!a)return;
  const b=S.bills[e.target.dataset.i],sku=a==='r'?e.target.dataset.s:null,it=sku&&b.items.find(x=>x.sku===sku);
  modal(sku?'ຮັບຄືນ: '+it.name:'ຍົກເລີກບິນ '+fmt(b.total),(sku?`<div class="m">ຈຳນວນ (ສູງສຸດ ${it.remaining})</div><input id="rq" type="number" inputmode="numeric" min="1" max="${it.remaining}" value="1">`:'')+'<div class="m">ເຫດຜົນ</div><input id="rs">','ຢືນຢັນ',async()=>{
    const reason=$('rs').value.trim();if(!reason)throw new Error('ກະລຸນາໃສ່ເຫດຜົນ');
    const d={requestId:uid(),billId:b.billId,reason};
    if(sku)d.items=[{sku,qty:Number($('rq').value)}];
    const r=await api(sku?'returnItems':'voidBill',d);
    modal('ຄືນເງິນລູກຄ້າ',`<div class="tot">${fmt(r.refund)}</div><p class="m">${esc(r.refundNote||'ຄືນເງິນສົດໃຫ້ລູກຄ້າ')}</p>`,'ປິດ',closeM);
    await load();loadBills();
  });
};

/* ประวัติ */
async function loadHist(){
  try{
    const l=(await api('history',{limit:60})).logs;
    $('hl').innerHTML=l.length?l.map(x=>`<div class="c r"><div><b>${T[x.type]||esc(x.type)}</b> ${esc(x.name)}
      <div class="m">${esc(x.timestamp)} · ${esc(x.user)}${x.note?' · '+esc(x.note):''}</div></div>
      <div style="text-align:right">${x.qty.toLocaleString('en-US')}<div class="m">${x.total?fmt(x.total):''}</div></div></div>`).join(''):'<p class="m">ຍັງບໍ່ມີປະຫວັດ</p>';
  }catch(e){toast(e.message,1)}
}
$('hr').onclick=loadHist;

/* รายงาน */
$('rg').onclick=async()=>{
  try{
    const a=(await api('analytics',{month:$('rm').value})).analytics;
    const bars=(l,k,n)=>{const mx=Math.max(1,...l.map(x=>x[k]));return l.map(x=>`<div class="r"><span>${esc(x[n])}</span><b>${fmt(x[k])}</b></div><div class="bar" style="width:${Math.max(2,x[k]/mx*100)}%"></div>`).join('')||'<p class="m">-</p>'};
    $('rb').innerHTML=`<div class="c"><div class="m">ຍອດຂາຍສຸດທິ</div><div class="tot">${fmt(a.totalRevenue)}</div>
      <div class="m">ຍອດຂາຍ ${fmt(a.grossSales)} · ຮັບຄືນ ${fmt(a.totalRefunds)}<br>${a.totalBills} ບິນ · ${a.totalItemsSold.toLocaleString('en-US')} ຊິ້ນ</div></div>
      <div class="c"><b>ໝວດໝູ່</b>${bars(a.categories,'revenue','category')}</div>
      <div class="c"><b>ວິທີຊຳລະ</b>${bars(a.paymentMethods.map(x=>({...x,method:MT[x.method]||x.method})),'revenue','method')}</div>
      <div class="c"><b>ສິນຄ້າຂາຍດີ</b>${a.topProducts.map((x,i)=>`<div class="r"><span>${i+1}. ${esc(x.name)}</span><span>${x.qty} ຊິ້ນ · ${fmt(x.revenue)}</span></div>`).join('')||'<p class="m">-</p>'}</div>`;
  }catch(e){toast(e.message,1)}
};

/* ตั้งค่า QR */
function fillSet(){
  if(!isA())return;
  $('cb').value=S.qr.bankName||'';$('cn').value=S.qr.accountName||'';$('ca').value=S.qr.accountNo||'';
  $('cst').textContent=S.qr.hasPayload?'ຕັ້ງຄ່າ QR ແລ້ວ (ວາງຂໍ້ຄວາມໃໝ່ເພື່ອປ່ຽນ)':'ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ QR';
}
$('cs').onclick=async()=>{
  try{
    const r=await api('saveQrConfig',{bankName:$('cb').value,accountName:$('cn').value,accountNo:$('ca').value,emvPayload:$('ce').value});
    $('ce').value='';S.qr=r.qrConfig;fillSet();toast(r.message);
  }catch(e){toast(e.message,1)}
};

if(S.session&&S.user)start().catch(out);
</script>
</body>
</html>
